<form id="loginForm">
<div class="mb-3">
    <label for="email" class="form-label text-secondary small fw-semibold">E-mail</label>
    <input type="email" id="email" class="form-control" placeholder="seu@email.com" required autocomplete="username">
</div>

<div class="mb-3">
    <label for="password" class="form-label text-secondary small fw-semibold">Senha</label>
    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
</div>

    <button type="submit" id="btn-singIn" class="btn btn-primary fw-semibold">
        Entrar
    </button>
    <button type="button" id="btn-singUp" class="btn btn-outline-secondary">
        Cadastrar-se
    </button>
    <div class="text-center mt-3">
        <button type="button" id="btn-forgotPassword" class="btn btn-link btn-sm text-decoration-none">
            Esqueceu a senha?
        </button>
    </div>
    <p id="feedback"    ></p>


</div>
</form>
